name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Static site quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build the static site
        run: npm run build

      - name: Verify static output
        run: npm run verify:dist

      - name: Verify development placeholders hide no configuration drift
        run: npm run verify:development-config

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/report
            output/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate the deployment bundle
        run: npx wrangler deploy --dry-run

  cms-auth:
    name: CMS OAuth Worker quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cms-auth

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/cms-auth/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Check Worker formatting
        run: npm run format:check

      - name: Check Worker TypeScript
        run: npm run check

      - name: Regenerate Worker binding types
        run: npx wrangler types

      - name: Verify generated Worker types are current
        run: git diff --exit-code -- worker-configuration.d.ts

      - name: Run Worker tests
        run: npm run test

      - name: Verify development placeholders hide no Worker configuration drift
        run: npm run verify:development-config

      - name: Validate the Worker bundle
        run: npx wrangler deploy --dry-run

  cms-admin:
    name: CMS Admin static asset quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cms-admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/cms-admin/package-lock.json

      - name: Install CMS Admin dependencies
        run: npm ci

      - name: Check CMS Admin formatting
        run: npm run format:check

      - name: Verify CMS Admin response headers
        run: npm run test:headers

      - name: Verify development placeholders hide no Admin configuration drift
        run: npm run verify:development-config

      - name: Validate the CMS Admin static asset bundle
        run: npx wrangler deploy --dry-run
