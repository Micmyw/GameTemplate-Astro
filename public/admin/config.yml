backend:
  name: github
  repo: Micmyw/GameTemplate-Astro
  branch: main
  auth_scope: public_repo
  # PR 5A intentionally has no base_url or auth_endpoint. The production
  # base_url is added in PR 5B only after the OAuth Worker passes code review
  # and is deployed to its real Origin.

local_backend:
  url: http://127.0.0.1:8081/api/v1
  allowed_hosts:
    - 127.0.0.1
    - localhost

collections:
  - name: games
    label: Games
    label_singular: Game
    folder: src/content/games
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{status}}"
    media_folder: src/assets/images/games
    public_folder: ../../assets/images/games
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: SEO title, name: seoTitle, widget: string, required: true }
      - {
          label: SEO description,
          name: seoDescription,
          widget: text,
          required: true,
        }
      - {
          label: Short description,
          name: shortDescription,
          widget: text,
          required: true,
        }
      - { label: Cover image, name: coverImage, widget: image, required: true }
      - {
          label: Cover image alt text,
          name: coverAlt,
          widget: string,
          required: true,
        }
      - label: Screenshots
        name: screenshots
        widget: list
        required: true
        fields:
          - { label: Image, name: image, widget: image, required: true }
          - { label: Alt text, name: alt, widget: string, required: true }
      - label: Game embed URL
        name: embedUrl
        widget: string
        required: true
        hint: Astro build validation against PUBLIC_GAME_ORIGINS is the final permission boundary.
        pattern:
          - '^https:\/\/[^#]+\/index\.html(?:\?[^#]*)?$'
          - Must use HTTPS, end with case-sensitive /index.html, and contain no fragment.
      - label: Categories
        name: categories
        widget: relation
        required: true
        collection: categories
        search_fields: [name]
        display_fields: [name]
        value_field: "{{slug}}"
        multiple: true
      - { label: Tags, name: tags, widget: list, required: true }
      - label: Controls
        name: controls
        widget: list
        required: true
        fields:
          - { label: Input, name: input, widget: string, required: true }
          - { label: Action, name: action, widget: string, required: true }
      - { label: Featured, name: featured, widget: boolean, required: true }
      - label: Mobile support
        name: mobileSupport
        widget: select
        required: true
        options: [yes, no, partial]
      - label: Orientation
        name: orientation
        widget: select
        required: true
        options: [landscape, portrait, both]
      - label: Load mode
        name: loadMode
        widget: select
        required: true
        options: [click, eager]
      - label: Aspect ratio
        name: aspectRatio
        widget: string
        required: true
        pattern:
          - '^[1-9]\d*\/[1-9]\d*$'
          - Use two positive integers, for example 16/9.
      - label: Status
        name: status
        widget: select
        required: true
        options: [draft, published]
      - label: Published date
        name: publishedAt
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Updated date
        name: updatedAt
        widget: datetime
        required: true
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Source
        name: source
        widget: object
        required: true
        fields:
          - { label: Name, name: name, widget: string, required: true }
          - {
              label: URL,
              name: url,
              widget: string,
              required: true,
              pattern: ['^https:\/\/', Must use HTTPS.],
            }
          - { label: License, name: license, widget: string, required: true }
      - label: Related games
        name: relatedGames
        widget: relation
        required: true
        collection: games
        search_fields: [title]
        display_fields: [title]
        value_field: "{{slug}}"
        multiple: true
      - { label: Body, name: body, widget: markdown, required: true }

  - name: categories
    label: Categories
    label_singular: Category
    folder: src/content/categories
    create: true
    extension: md
    format: frontmatter
    identifier_field: name
    summary: "{{name}} — {{status}}"
    fields:
      - { label: Name, name: name, widget: string, required: true }
      - { label: SEO title, name: seoTitle, widget: string, required: true }
      - {
          label: SEO description,
          name: seoDescription,
          widget: text,
          required: true,
        }
      - {
          label: Short description,
          name: shortDescription,
          widget: text,
          required: true,
        }
      - {
          label: Order,
          name: order,
          widget: number,
          required: true,
          value_type: int,
          min: 0,
        }
      - { label: Featured, name: featured, widget: boolean, required: true }
      - label: Status
        name: status
        widget: select
        required: true
        options: [draft, published]
      - { label: Body, name: body, widget: markdown, required: true }
